[package]
name = "breakout"
version = "0.4.0"
description = "Breakout detection for Rust"
repository = "https://github.com/ankane/breakout-rust"
license = "GPL-2.0-or-later"
authors = ["Andrew Kane <andrew@ankane.org>"]
edition = "2021"
rust-version = "1.66.0"
readme = "README.md"

[lib]
doctest = false

[dependencies]
libm = { version = "0.2", optional = true }

[features]
no_std = ["libm"]
